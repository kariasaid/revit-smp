; Pengaturan upload RAB/Progres SMPN
; File ini dibaca PHP CGI/FPM dari direktori public.
; Untuk Apache mod_php, pengaturan yang sama dapat ditempatkan di php.ini/server.

upload_max_filesize = 15M
post_max_size = 256M
max_file_uploads = 50
max_input_time = 300
max_execution_time = 300
memory_limit = 512M
